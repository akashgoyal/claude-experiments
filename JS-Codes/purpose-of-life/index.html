<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purpose, Piece by Piece</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Gochi+Hand&family=Special+Elite&display=swap">
<style>
  [hidden] { display: none !important; }
  :root {
    color-scheme: light;
    --desk: #c49a6c;
    --desk-deep: #a97e52;
    --ink: #2b2a33;
    --paper: #f7f0e1;
    --tomato: #e5533d;
    --teal: #2a9d8f;
    --mustard: #f2b134;
  }
  html, body { height: auto; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 20%, #cfa678 0%, var(--desk) 55%, var(--desk-deep) 100%) fixed, var(--desk);
    color: var(--ink);
    font-family: "Gochi Hand", "Comic Sans MS", "Marker Felt", cursive;
    padding-block: 24px 40px;
    padding-inline: 16px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  h1 { margin: 0; font-weight: 400; font-size: clamp(26px, 4vw, 40px); line-height: 1.1; text-wrap: balance; }
  .sub { margin: 0; font-family: "Special Elite", "Courier New", monospace; font-size: 14px; letter-spacing: .02em; opacity: .85; }
  .stage {
    position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
    background: #b98b5b; border-radius: 3px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(60, 35, 10, .38), 0 2px 0 rgba(60, 35, 10, .25);
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(43, 42, 51, .16);
  }
  .bigplay {
    font: 400 clamp(20px, 3.4vw, 32px) "Gochi Hand", cursive;
    color: #fffaf0; background: var(--tomato); border: 0; cursor: pointer;
    padding: .45em 1.1em .5em; transform: rotate(-2.5deg);
    box-shadow: 4px 5px 0 rgba(43, 42, 51, .35);
    clip-path: polygon(0 6%, 4% 0, 30% 4%, 58% 0, 86% 5%, 100% 0, 98% 48%, 100% 94%, 72% 100%, 44% 96%, 16% 100%, 1% 95%, 3% 50%);
    transition: transform .15s ease;
  }
  .bigplay:hover { transform: rotate(-1deg) scale(1.04); }
  .bigplay:focus-visible, .ctl:focus-visible, .bar:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }
  .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; }
  .ctl {
    font: 400 19px "Gochi Hand", cursive; color: var(--ink); background: var(--paper);
    border: 2px solid var(--ink); border-radius: 3px; padding: 3px 14px 4px; cursor: pointer;
    box-shadow: 2px 3px 0 var(--ink);
  }
  .ctl:nth-child(odd) { transform: rotate(-1.2deg); }
  .ctl:nth-child(even) { transform: rotate(1deg); }
  .ctl:active { box-shadow: 0 1px 0 var(--ink); translate: 1px 2px; }
  .bar {
    flex: 1 1 160px; height: 12px; position: relative; cursor: pointer;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; overflow: hidden;
  }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(-45deg, var(--teal) 0 6px, #238a7e 6px 12px); }
  .time { font-family: "Special Elite", "Courier New", monospace; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
  @media (max-width: 520px) { .time { min-width: 0; } .ctl { font-size: 17px; padding-inline: 10px; } }
</style>
</head>
<body>

<main class="wrap">
  <header>
    <h1>What is the purpose of life?</h1>
    <p class="sub">A 48-second cut-paper film. Turn your sound on.</p>
  </header>
  <div class="stage">
    <canvas id="cv" role="img" aria-label="Hand-drawn paper collage animation asking what the purpose of life is: making, loving, learning, helping, noticing, and finally making your own."></canvas>
    <div class="overlay" id="ov"><button class="bigplay" id="big">&#9654; Play with sound</button></div>
  </div>
  <div class="controls">
    <button class="ctl" id="pp">Play</button>
    <button class="ctl" id="rs">Restart</button>
    <button class="ctl" id="mu" aria-pressed="false">Mute</button>
    <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="48" aria-valuenow="0"><div class="fill" id="fill"></div></div>
    <span class="time" id="tm">0:00 / 0:48</span>
  </div>
</main>

<script>
(() => {
'use strict';
const W = 1280, H = 720, DUR = 48, SCENE = 6, TAU = Math.PI * 2;
const C = {
  ink: '#2b2a33', pen: '#6b6270', tomato: '#e5533d', mustard: '#f2b134', teal: '#2a9d8f',
  sky: '#8ecae6', pink: '#f4a3b4', leaf: '#6aa84f', leaf2: '#4f8a3c', leaf3: '#8cc46a',
  brown: '#8a5a33', cream: '#fffaf0', grass: '#9ccc7c', lilac: '#b9a3e3'
};
const cv = document.getElementById('cv');
const cx = cv.getContext('2d');

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - clamp(t), 3);
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const back = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function bounce(x) {
  const n1 = 7.5625, d1 = 2.75;
  if (x < 1 / d1) return n1 * x * x;
  if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + .75;
  if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + .9375;
  return n1 * (x -= 2.625 / d1) * x + .984375;
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* "boiling line" jitter: stable within a boil frame (8 per second) */
let boil = 0, jc = 0;
function jit() { jc++; const n = Math.sin(jc * 12.9898 + boil * 78.233) * 43758.5453; return (n - Math.floor(n)) * 2 - 1; }

/* ---------- shapes ---------- */
const cache = new Map();
const torn = (k, gen) => { if (!cache.has(k)) cache.set(k, gen()); return cache.get(k); };
const R = (x, y, w, h) => [[x - w / 2, y - h / 2], [x + w / 2, y - h / 2], [x + w / 2, y + h / 2], [x - w / 2, y + h / 2]];
const circPts = (r, n = 28, x = 0, y = 0, ry = r) => Array.from({ length: n }, (_, i) => [x + Math.cos(i / n * TAU) * r, y + Math.sin(i / n * TAU) * ry]);
function heartPts(s, n = 48, ox = 0, oy = 0) {
  const a = [];
  for (let i = 0; i < n; i++) {
    const t = i / n * TAU;
    a.push([ox + 16 * Math.pow(Math.sin(t), 3) * s, oy - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s]);
  }
  return a;
}
function starPts(Ro, Ri, n = 5) {
  const a = [];
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? Ri : Ro, t = -Math.PI / 2 + i / (n * 2) * TAU; a.push([Math.cos(t) * r, Math.sin(t) * r]); }
  return a;
}
function leafPts(len, wid, n = 10) {
  const a = [];
  for (let i = 0; i <= n; i++) { const t = i / n; a.push([t * len, -Math.sin(t * Math.PI) * wid]); }
  for (let i = n - 1; i > 0; i--) { const t = i / n; a.push([t * len, Math.sin(t * Math.PI) * wid]); }
  return a;
}
function cloudPts(w, h, seed) {
  const r = mulberry(seed), a = [], n = 40, ph = r() * 6;
  for (let i = 0; i < n; i++) {
    const t = i / n * TAU, rr = 1 + .16 * Math.abs(Math.sin(t * 3.5 + ph));
    let y = Math.sin(t) * h * rr; if (y > 0) y *= .4;
    a.push([Math.cos(t) * w * rr, y]);
  }
  return a;
}
function tornPoly(base, seed, amp = 2.2, step = 7) {
  const r = mulberry(seed), out = [], n = base.length;
  for (let i = 0; i < n; i++) {
    const a = base[i], b = base[(i + 1) % n];
    const m = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let j = 0; j < m; j++) {
      const u = j / m;
      out.push([lerp(a[0], b[0], u) + (r() - .5) * amp * 2, lerp(a[1], b[1], u) + (r() - .5) * amp * 2]);
    }
  }
  return out;
}
const seg = (x1, y1, x2, y2, n) => {
  n = n || Math.max(3, Math.round(Math.hypot(x2 - x1, y2 - y1) / 24));
  return Array.from({ length: n + 1 }, (_, i) => [lerp(x1, x2, i / n), lerp(y1, y2, i / n)]);
};
const ell = (x, y, rx, ry, n = 24, a0 = 0, a1 = TAU) =>
  Array.from({ length: n + 1 }, (_, i) => { const t = lerp(a0, a1, i / n); return [x + Math.cos(t) * rx, y + Math.sin(t) * ry]; });

/* ---------- drawing primitives ---------- */
let grainPat = null;
function makeGrain() {
  const g = document.createElement('canvas'); g.width = g.height = 180;
  const gx = g.getContext('2d'), id = gx.createImageData(180, 180);
  for (let i = 0; i < id.data.length; i += 4) { const v = 212 + Math.random() * 43; id.data[i] = v; id.data[i + 1] = v - 4; id.data[i + 2] = v - 11; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0);
  gx.strokeStyle = 'rgba(120,85,45,.2)';
  for (let i = 0; i < 50; i++) { const x = Math.random() * 180, y = Math.random() * 180; gx.beginPath(); gx.moveTo(x, y); gx.lineTo(x + (Math.random() - .5) * 22, y + (Math.random() - .5) * 22); gx.stroke(); }
  grainPat = cx.createPattern(g, 'repeat');
}
function P(x, y, r, s, fn) {
  if (s <= .001) return;
  cx.save(); cx.translate(x, y); if (r) cx.rotate(r); if (s !== 1) cx.scale(s, s); fn(); cx.restore();
}
function poly(pts) { cx.beginPath(); cx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) cx.lineTo(pts[i][0], pts[i][1]); cx.closePath(); }
function paper(pts, col, shadow = true) {
  if (shadow) { cx.save(); cx.translate(4, 5); cx.fillStyle = 'rgba(70,40,12,.26)'; poly(pts); cx.fill(); cx.restore(); }
  cx.fillStyle = col; poly(pts); cx.fill();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  cx.save(); cx.clip(); cx.globalAlpha = .38; cx.globalCompositeOperation = 'multiply';
  cx.fillStyle = grainPat; cx.fillRect(x0, y0, x1 - x0, y1 - y0); cx.restore();
}
function rough(pts, { w = 3, col = C.ink, p = 1, wob = 1.6, passes = 2 } = {}) {
  if (p <= 0) return;
  let q = pts;
  if (p < 1) {
    const f = (pts.length - 1) * p, k = Math.floor(f), u = f - k;
    q = pts.slice(0, k + 1);
    if (k < pts.length - 1) q.push([lerp(pts[k][0], pts[k + 1][0], u), lerp(pts[k][1], pts[k + 1][1], u)]);
  }
  if (q.length < 2) return;
  cx.save(); cx.strokeStyle = col; cx.lineCap = 'round'; cx.lineJoin = 'round';
  for (let s = 0; s < passes; s++) {
    cx.lineWidth = s ? w * .5 : w;
    const r = q.map(([x, y]) => [x + jit() * wob, y + jit() * wob]);
    cx.beginPath(); cx.moveTo(r[0][0], r[0][1]);
    for (let i = 1; i < r.length - 1; i++) cx.quadraticCurveTo(r[i][0], r[i][1], (r[i][0] + r[i + 1][0]) / 2, (r[i][1] + r[i + 1][1]) / 2);
    cx.lineTo(r[r.length - 1][0], r[r.length - 1][1]);
    cx.stroke();
  }
  cx.restore();
}
function dot(x, y, r, col = C.ink) { if (r <= 0) return; cx.fillStyle = col; cx.beginPath(); cx.arc(x + jit() * .5, y + jit() * .5, r, 0, TAU); cx.fill(); }
function tape(x, y, w, r) {
  P(x, y, r, 1, () => {
    const h = 24; cx.beginPath(); cx.moveTo(-w / 2, -h / 2); cx.lineTo(w / 2, -h / 2);
    for (let k = 1; k <= 4; k++) cx.lineTo(w / 2 + (k % 2 ? -4 : 0), -h / 2 + k * h / 4);
    cx.lineTo(-w / 2, h / 2);
    for (let k = 3; k >= 0; k--) cx.lineTo(-w / 2 + (k % 2 ? 4 : 0), -h / 2 + k * h / 4);
    cx.fillStyle = 'rgba(252,246,222,.66)'; cx.fill();
    cx.strokeStyle = 'rgba(140,110,60,.18)'; cx.lineWidth = 1; cx.stroke();
  });
}
function spark(x, y, s, col = C.mustard) {
  P(x, y, 0, s, () => {
    rough(seg(0, -18, 0, 18, 3), { w: 3.5, col }); rough(seg(-18, 0, 18, 0, 3), { w: 3.5, col });
    rough(seg(-8, -8, 8, 8, 2), { w: 2, col }); rough(seg(-8, 8, 8, -8, 2), { w: 2, col });
  });
}
function ground(y = 600) { rough(seg(40, y, 1240, y + 3, 26), { w: 2.5, col: C.pen }); }
function grassTufts(xs, y = 600) { xs.forEach(x => rough([[x - 8, y], [x - 4, y - 12], [x, y], [x + 4, y - 16], [x + 8, y]], { w: 2, col: C.leaf2, wob: 1 })); }

/* ---------- ransom-note lettering ---------- */
const FONTS = ['"Abril Fatface", Georgia, serif', '"Special Elite", "Courier New", monospace', '"Gochi Hand", cursive', 'Georgia, serif'];
const RCOL = [['#fffaf0', C.ink], [C.ink, '#fffaf0'], [C.tomato, '#fffaf0'], [C.mustard, C.ink], [C.sky, C.ink], ['#ffffff', C.tomato], [C.teal, '#fffaf0'], [C.pink, C.ink]];
const layoutCache = new Map();
function ransomLayout(sp) {
  const key = sp.text + sp.seed;
  if (layoutCache.has(key)) return layoutCache.get(key);
  const r = mulberry(sp.seed), S = sp.size, items = [];
  let x = 0, lastC = -1;
  for (const ch of sp.text) {
    if (ch === ' ') { x += S * .38; continue; }
    const f = FONTS[Math.floor(r() * FONTS.length)];
    let ci = Math.floor(r() * RCOL.length); if (ci === lastC) ci = (ci + 3) % RCOL.length; lastC = ci;
    const fs = S * (.8 + r() * .3);
    cx.font = `${fs}px ${f}`;
    const w = cx.measureText(ch).width, bw = w + S * .3, bh = S * 1.1 + r() * S * .12;
    items.push({ ch, f, fs, c: RCOL[ci], x: x + bw / 2, rot: (r() - .5) * .22, dy: (r() - .5) * S * .14, pts: tornPoly(R(0, 0, bw, bh), Math.floor(r() * 1e6), 1.4, 6) });
    x += bw + S * .06;
  }
  const total = x - S * .06; items.forEach(it => it.x -= total / 2);
  layoutCache.set(key, items); return items;
}
function ransom(sp, t) {
  ransomLayout(sp).forEach((it, i) => {
    const p = prog(t, sp.tIn + i * sp.step, .28); if (p <= 0) return;
    P(sp.x + it.x, sp.y + it.dy, it.rot + (1 - p) * .7, back(p), () => {
      paper(it.pts, it.c[0]);
      cx.fillStyle = it.c[1]; cx.font = `${it.fs}px ${it.f}`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText(it.ch, 0, it.fs * .05);
    });
  });
}
const RS = {
  a: { scene: 0, text: 'WHAT IS THE', x: 520, y: 180, size: 46, tIn: .3, step: .06, seed: 11 },
  b: { scene: 0, text: 'PURPOSE', x: 520, y: 318, size: 112, tIn: 1.0, step: .11, seed: 29 },
  c: { scene: 0, text: 'OF LIFE?', x: 520, y: 458, size: 72, tIn: 1.9, step: .09, seed: 37 },
  d: { scene: 7, text: 'YOURS TO MAKE', x: 620, y: 540, size: 56, tIn: 2.8, step: .08, seed: 53 }
};

/* ---------- captions ---------- */
function caption(text, t, tIn = .5) {
  if (t < tIn - .3) return;
  const shown = Math.floor(clamp((t - tIn) / (text.length * .035)) * text.length);
  cx.font = '40px "Gochi Hand", cursive';
  const w = Math.min(1120, cx.measureText(text).width + 74);
  const a = eo(prog(t, tIn - .3, .35));
  P(640, 650 + (1 - a) * 50, -.012, 1, () => {
    cx.globalAlpha = a;
    paper(torn('cap' + text, () => tornPoly(R(0, 0, w, 66), text.length * 7 + 3, 1.6, 8)), C.cream);
    cx.fillStyle = C.ink; cx.font = '40px "Gochi Hand", cursive'; cx.textAlign = 'left'; cx.textBaseline = 'middle';
    cx.fillText(text.slice(0, shown), -w / 2 + 36, 2);
    tape(-w / 2 + 12, -28, 72, -.55);
  });
}

/* ---------- Pip, our little paper person ---------- */
function pip(x, y, s, o = {}) {
  const t = o.t || 0, walk = o.walk || 0, aL = o.aL ?? .12, aR = o.aR ?? .12, look = o.look || 0;
  const head = o.head || C.mustard, shirt = o.shirt || C.teal;
  P(x, y + (o.bob || 0), o.rot || 0, s, () => {
    if (o.flip) cx.scale(-1, 1);
    const sw = Math.sin(walk) * 12;
    rough([[-7, -60], [-9 + sw * .5, -30], [-11 + sw, 0]], { w: 4.5 });
    rough([[7, -60], [9 - sw * .5, -30], [11 - sw, 0]], { w: 4.5 });
    rough(seg(-11 + sw, 0, -23 + sw, 1, 2), { w: 5 });
    rough(seg(11 - sw, 0, 23 - sw, 1, 2), { w: 5 });
    paper(torn('pb' + shirt, () => tornPoly(R(0, -88, 48, 64), 5, 1.6, 6)), shirt);
    const arm = (sx, ang, side) => {
      const c = Math.cos(ang), sn = Math.sin(ang);
      const hd = [sx + c * 44, -110 + sn * 44];
      rough([[sx, -110], [sx + c * 22 - sn * 4 * side, -110 + sn * 22 + c * 4 * side], hd], { w: 4.5 });
      dot(hd[0], hd[1], 4.5);
    };
    arm(-20, Math.PI / 2 + aL * Math.PI * .75, 1);
    arm(20, Math.PI / 2 - aR * Math.PI * .75, -1);
    paper(torn('ph' + head, () => tornPoly(circPts(34, 26, 0, -150), 9, 1.5, 6)), head);
    rough(ell(0, -150, 34, 34, 20), { w: 3 });
    rough([[-4, -184], [-1, -197], [8, -194], [4, -186]], { w: 3 });
    const ex = look * 6;
    if ((t % 3.3) < .12) { rough(seg(-15 + ex, -153, -7 + ex, -153, 2), { w: 2.5 }); rough(seg(7 + ex, -153, 15 + ex, -153, 2), { w: 2.5 }); }
    else { dot(-11 + ex, -153, 4); dot(11 + ex, -153, 4); }
    cx.fillStyle = 'rgba(229,83,61,.35)';
    cx.beginPath(); cx.arc(-21 + ex * .5, -140, 5.5, 0, TAU); cx.arc(21 + ex * .5, -140, 5.5, 0, TAU); cx.fill();
    if (o.mouth === 'o') rough(ell(ex * .8, -136, 5, 6, 10), { w: 2.5, wob: .8 });
    else rough(ell(ex * .8, -142, 10, 7, 8, .15 * Math.PI, .85 * Math.PI), { w: 2.5, wob: .8 });
  });
}
function pipHand(x, y, s, a, right = true) {
  const ang = right ? Math.PI / 2 - a * Math.PI * .75 : Math.PI / 2 + a * Math.PI * .75;
  return [x + s * ((right ? 20 : -20) + Math.cos(ang) * 44), y + s * (-110 + Math.sin(ang) * 44)];
}

/* ---------- little collage icons (about 100px) ---------- */
function icHouse() {
  paper(torn('ihw', () => tornPoly(R(0, 18, 84, 60), 41, 1.4, 6)), C.sky);
  paper(torn('ihr', () => tornPoly([[-56, -8], [0, -56], [56, -8]], 42, 1.4, 6)), C.tomato);
  paper(torn('ihd', () => tornPoly(R(-16, 34, 20, 28), 43, 1, 5)), C.mustard);
  rough([[12, 6], [32, 6], [32, 24], [12, 24], [12, 6]], { w: 2.5, wob: 1 });
}
function icHeart() {
  const h = heartPts(3.3);
  paper(torn('iht', () => tornPoly(h, 44, 1.3, 6)), C.tomato);
  rough(h.concat([h[0]]), { w: 2.5, wob: 1 });
}
function icStar(col = C.mustard) {
  const s = starPts(52, 23);
  paper(torn('ist' + col, () => tornPoly(s, 45, 1.3, 6)), col);
  rough(s.concat([s[0]]), { w: 2.5, wob: 1 });
}
function icTree() {
  paper(torn('itt', () => tornPoly(R(0, 30, 18, 52), 46, 1, 5)), C.brown);
  paper(torn('itc1', () => tornPoly(circPts(26, 20, -20, 0), 47, 1.3, 6)), C.leaf2);
  paper(torn('itc2', () => tornPoly(circPts(26, 20, 20, 0), 48, 1.3, 6)), C.leaf);
  paper(torn('itc3', () => tornPoly(circPts(30, 20, 0, -22), 49, 1.3, 6)), C.leaf3);
}
function icSun(rot = 0) {

const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
function route(node, rev = .4) { node.connect(MASTER); if (rev) { const g = AC.createGain(); g.gain.value = rev; node.connect(g); g.connect(WET); } }
function env(w, peak, att, dec) { const g = AC.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(peak, w + att); g.gain.exponentialRampToValueAtTime(.0001, w + att + dec); return g; }
function osc(type, f, w, end, dest) { const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, w); o.connect(dest); o.start(w); o.stop(end); return o; }
function noiseSrc(w, dur, dest) { const s = AC.createBufferSource(); s.buffer = NOISE; s.connect(dest); s.start(w, Math.random() * (1.9 - dur)); s.stop(w + dur); }
const SND = {
  pluck(w, f, v = .14) {
    const g = env(w, v, .006, 1.3); route(g, .45); osc('sine', f, w, w + 1.4, g);
    const g2 = env(w, v * .35, .004, .35); route(g2, .3); osc('triangle', f * 2, w, w + .4, g2);
    const g3 = env(w, v * .1, .002, .18); g3.connect(MASTER); osc('sine', f * 4.2, w, w + .2, g3);
  },
  pad(w, fs, dur) {
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(650, w); lp.frequency.linearRampToValueAtTime(1100, w + dur / 2); lp.frequency.linearRampToValueAtTime(650, w + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.018, w + .5);
    g.gain.setValueAtTime(.018, w + dur - .3); g.gain.linearRampToValueAtTime(0, w + dur + .6);
    lp.connect(g); route(g, .6);
    fs.forEach(f => [-7, 7].forEach(d => { osc('sawtooth', f, w, w + dur + .7, lp).detune.value = d; }));
  },
  bass(w, f, v = .2) {
    const g = env(w, v, .01, 1.1); route(g, .1); osc('sine', f, w, w + 1.2, g);
    const g2 = env(w, v * .3, .01, .3); g2.connect(MASTER); osc('triangle', f * 2, w, w + .35, g2);
  },
  shaker(w, v = .022) {
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    const g = env(w, v, .004, .06); hp.connect(g); route(g, 0); noiseSrc(w, .09, hp);
  },
  swoosh(w) {
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.3;
    bp.frequency.setValueAtTime(350, w); bp.frequency.exponentialRampToValueAtTime(2600, w + .45);
    const g = AC.createGain(); g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.24, w + .18); g.gain.linearRampToValueAtTime(0, w + .6);
    bp.connect(g); route(g, .3); noiseSrc(w, .65, bp);
  },
  pop(w, f = 600, v = .12) { const g = env(w, v, .003, .12); route(g, .25); osc('sine', f, w, w + .16, g).frequency.exponentialRampToValueAtTime(f * 1.9, w + .07); },
  thunk(w, v = .32) {
    const g = env(w, v, .003, .22); route(g, .15); osc('sine', 170, w, w + .26, g).frequency.exponentialRampToValueAtTime(65, w + .2);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    const g2 = env(w, v * .45, .002, .07); lp.connect(g2); route(g2, .1); noiseSrc(w, .08, lp);
  },
  chime(w, f, v = .09) {
    const g = env(w, v, .004, 2.6); route(g, .7); osc('sine', f, w, w + 2.7, g);
    const g2 = env(w, v * .3, .003, 1.2); route(g2, .7); osc('sine', f * 2.76, w, w + 1.3, g2);
  },
  tweet(w) { const g = env(w, .07, .005, .1); route(g, .3); const o = osc('sine', 2300, w, w + .13, g); o.frequency.exponentialRampToValueAtTime(3600, w + .06); o.frequency.exponentialRampToValueAtTime(2800, w + .11); },
  drip(w, f) { const g = env(w, .09, .003, .14); route(g, .4); osc('sine', f * 1.8, w, w + .17, g).frequency.exponentialRampToValueAtTime(f, w + .05); },
  scribble(w, dur, v = .07) {
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 2;
    const g = AC.createGain(); g.gain.setValueAtTime(0, w);
    for (let tt = w; tt < w + dur; tt += .08 + Math.random() * .05) { g.gain.linearRampToValueAtTime(v * (.3 + Math.random() * .7), tt + .03); g.gain.linearRampToValueAtTime(v * .1, tt + .07); }
    g.gain.linearRampToValueAtTime(0, w + dur + .05);
    bp.connect(g); route(g, .1); noiseSrc(w, dur + .1, bp);
  }
};

/* the score: 80 bpm, one bar = 3 s, two bars per scene */
function buildScore() {
  const ev = [], add = (t, fn) => ev.push({ t, fn });
  const BAR = 3, E8 = .375;
  const PROG = ['C', 'Am', 'F', 'G', 'C', 'Em', 'F', 'G', 'Am', 'F', 'C', 'G', 'F', 'G', 'F', 'C'];
  const PAD = { C: [55, 60, 64], Am: [57, 60, 64], F: [57, 60, 65], G: [55, 59, 62], Em: [55, 59, 64] };
  const ROOT = { C: 48, Am: 45, F: 41, G: 43, Em: 40 };
  const MEL = [
    [76, 0, 79, 0, 84, 0, 83, 79], [81, 0, 0, 76, 0, 0, 72, 0], [77, 0, 81, 0, 84, 0, 81, 0], [79, 0, 83, 0, 86, 0, 0, 0],
    [88, 0, 84, 0, 79, 0, 84, 0], [83, 0, 79, 0, 76, 0, 79, 83], [84, 81, 77, 81, 84, 0, 86, 0], [86, 0, 83, 0, 79, 81, 83, 0],
    [84, 0, 81, 0, 76, 0, 81, 84], [86, 0, 84, 0, 81, 0, 77, 0], [79, 0, 84, 0, 88, 0, 86, 84], [83, 0, 79, 0, 0, 0, 74, 0],
    [77, 0, 81, 0, 84, 0, 0, 0], [83, 0, 86, 0, 91, 0, 0, 0], [84, 0, 81, 0, 77, 0, 76, 0], [76, 0, 79, 0, 84, 0, 0, 0]
  ];
  PROG.forEach((ch, b) => {
    const t = b * BAR, last = b === 15;
    add(t, w => SND.pad(w, PAD[ch].map(mtof), last ? 4.5 : BAR + .2));
    add(t, w => SND.bass(w, mtof(ROOT[ch])));
    if (!last) add(t + 2 * .75, w => SND.bass(w, mtof(ROOT[ch] + 7), .14));
    MEL[b].forEach((n, e) => {
      if (!n) return;
      add(t + e * E8, w => SND.pluck(w, mtof(n), b < 2 ? .12 : .14));
      if (b >= 4 && b <= 11 && e % 2 === 0) add(t + e * E8, w => SND.pluck(w, mtof(n + 12), .04));
    });
    if (b >= 2 && b <= 13) for (let e = 1; e < 8; e += 2) add(t + e * E8, w => SND.shaker(w, e === 3 || e === 7 ? .03 : .018));
  });
  add(46.9, w => SND.chime(w, mtof(96), .07));
  add(47.3, w => SND.chime(w, mtof(91), .05));

  // sound effects synced to the picture
  Object.values(RS).forEach(sp => {
    const n = sp.text.replace(/ /g, '').length;
    for (let i = 0; i < n; i++) add(sp.scene * SCENE + sp.tIn + i * sp.step + .04, w => SND.pop(w, 700 + (i % 5) * 110, .05));
  });
  for (let k = 1; k < 8; k++) add(k * SCENE - .05, w => SND.swoosh(w));
  add(2.6, w => SND.pop(w, 420, .14));
  add(3.2, w => SND.scribble(w, .85));
  add(4.18, w => SND.pop(w, 900, .1));
  S1P.forEach(pc => add(6 + pc.st + .22, w => SND.thunk(w)));
  [72, 76, 79, 84].forEach((n, i) => add(6 + 3.45 + i * .09, w => SND.pluck(w, mtof(n + 12), .07)));
  add(12 + 2.42, w => { SND.pop(w, 500, .14); SND.chime(w, mtof(84), .08); SND.chime(w + .12, mtof(88), .06); });
  for (let k = 0; k < 8; k++) add(12 + 2.9 + k * .32, w => SND.pop(w, [1200, 1350, 1500, 1800][k % 4], .03));
  add(18.32, w => SND.thunk(w, .2));
  [79, 81, 84, 86, 88, 91].forEach((n, i) => add(18 + 1.05 + i * .3, w => SND.chime(w, mtof(n), .05)));
  add(18 + 4.22, w => SND.chime(w, mtof(96), .09));
  for (let k = 0; k < 7; k++) add(24 + .9 + k * .36, w => SND.drip(w, 900 + (k % 3) * 180));
  S4CROWN.forEach(c => add(24 + c[4] + .03, w => SND.pop(w, 380, .12)));
  S4FRUIT.forEach((_, i) => add(24 + 3.82 + i * .15, w => SND.pop(w, 900 + i * 90, .06)));
  add(24 + 5.25, w => SND.tweet(w)); add(24 + 5.42, w => SND.tweet(w)); add(24 + 5.75, w => SND.tweet(w));
  S5FL.forEach((_, i) => add(30 + 1 + i * .4 + .6, w => SND.pop(w, 650 + i * 60, .05)));
  [[30.6, 91], [31.9, 88], [33.1, 93], [34.2, 86], [35.2, 91]].forEach(([t, n]) => add(t, w => SND.chime(w, mtof(n), .035)));
  for (let i = 0; i < 6; i++) add(36 + .2 + i * .18 + .05, w => SND.pop(w, 500 + i * 80, .1));
  add(42 + 1.22, w => SND.pop(w, 330, .14));
  for (let j = 0; j < 22; j++) add(42 + 1.4 + j * .05 + .03, w => SND.pop(w, 1100 + (j % 6) * 90, .025));
  add(42 + 4.6, w => SND.scribble(w, .55, .06));
  return ev.sort((a, b) => a.t - b.t);
}
const SCORE = buildScore();

/* ---------- playback ---------- */
const ov = document.getElementById('ov'), big = document.getElementById('big');
const pp = document.getElementById('pp'), rs = document.getElementById('rs'), mu = document.getElementById('mu');
const bar = document.getElementById('bar'), fill = document.getElementById('fill'), tm = document.getElementById('tm');
let state = 'idle', muted = false, posterT = 4.8, frozenT = 0, fallbackStart = 0;

function currentT() {
  if (state === 'idle') return posterT;
  if (state === 'ended') return DUR;
  if (state === 'paused') return frozenT;
  return AC ? AC.currentTime - t0 : (performance.now() / 1000 - fallbackStart);
}
function play(from = 0) {
  from = clamp(from, 0, DUR - .05);
  if (AC) { try { AC.close(); } catch (e) {} AC = null; }
  if (audioInit()) {
    t0 = AC.currentTime + .1 - from;
    SCORE.forEach(ev => { if (ev.t >= from - .02) ev.fn(t0 + ev.t); });
    if (AC.state === 'suspended') AC.resume();
  } else {
    fallbackStart = performance.now() / 1000 - from;
  }
  state = 'playing'; ov.hidden = true; pp.textContent = 'Pause';
}
function pause() {
  if (state !== 'playing') return;
  frozenT = currentT(); state = 'paused'; pp.textContent = 'Play';
  if (AC) AC.suspend();
}
function resume() {
  if (state !== 'paused') return;
  if (AC) { AC.resume(); }
  else fallbackStart = performance.now() / 1000 - frozenT;
  state = 'playing'; pp.textContent = 'Pause';
}
function toggle() {
  if (state === 'idle' || state === 'ended') play(0);
  else if (state === 'playing') pause();
  else resume();
}
big.addEventListener('click', toggle);
pp.addEventListener('click', toggle);
rs.addEventListener('click', () => play(0));
mu.addEventListener('click', () => {
  muted = !muted; mu.textContent = muted ? 'Unmute' : 'Mute'; mu.setAttribute('aria-pressed', String(muted));
  if (MASTER) MASTER.gain.setTargetAtTime(muted ? 0 : .85, AC.currentTime, .05);
});
function seekFromEvent(e) { const r = bar.getBoundingClientRect(); play(clamp((e.clientX - r.left) / r.width) * DUR); }
bar.addEventListener('click', seekFromEvent);
bar.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); play(clamp(currentT() + (e.key === 'ArrowRight' ? 5 : -5), 0, DUR)); }
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); toggle(); }
});

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function resize() {
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(2, Math.round(r.width * d)); cv.height = Math.max(2, Math.round(r.height * d));
}
window.addEventListener('resize', resize);

function frame() {
  let T = currentT();
  if (state === 'playing' && T >= DUR) {
    state = 'ended'; T = DUR; pp.textContent = 'Play';
    big.innerHTML = '&#8635; Watch again'; ov.hidden = false;
  }
  render(T);
  const shown = state === 'idle' ? 0 : clamp(T, 0, DUR);
  fill.style.width = (shown / DUR * 100) + '%';
  tm.textContent = `${fmt(shown)} / ${fmt(DUR)}`;
  bar.setAttribute('aria-valuenow', String(Math.round(shown)));
  requestAnimationFrame(frame);
}

const fontsReady = Promise.all([
  document.fonts.load('40px "Gochi Hand"'), document.fonts.load('40px "Abril Fatface"'), document.fonts.load('40px "Special Elite"')
]).catch(() => {});
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(() => {
  layoutCache.clear(); cache.clear();
  makeGrain(); resize(); requestAnimationFrame(frame);
});
})();
</script>
